<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zombie Survival V3</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="game-container">


    <!-- GAME TITLE -->

    <h1>
        🧟 ZOMBIE SURVIVAL: APOCALYPSE
    </h1>



    <!-- GAME HUD -->

    <div class="hud">


        <div class="stat">
            ❤️ HP:
            <span id="health">
                100
            </span>
        </div>


        <div class="stat">
            🔫 Ammo:
            <span id="ammo">
                12 / 12
            </span>
        </div>


        <div class="stat">
            🧟 Wave:
            <span id="wave">
                1
            </span>
        </div>


        <div class="stat">
            ☠️ Kills:
            <span id="kills">
                0
            </span>
        </div>


        <div class="stat">
            🪙 Coins:
            <span id="coins">
                0
            </span>
        </div>


    </div>



    <!-- GAME AREA -->

    <canvas 
        id="gameCanvas"
        width="900"
        height="600">
    </canvas>



    <!-- CONTROLS -->

    <div class="controls">


        <h3>
            Controls
        </h3>


        <p>
            W A S D - Move
        </p>


        <p>
            Mouse Click - Shoot
        </p>


        <p>
            R - Reload
        </p>


        <p>
            SPACE - Dash
        </p>


    </div>



    <!-- GAME OVER -->

    <div 
        id="gameOver"
        class="hidden">


        <h2>
            ☠️ YOU DIED
        </h2>


        <button id="restartBtn">
            Restart Game
        </button>


    </div>



</div>



<script src="script.js"></script>


</body>

</html>
